<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip · Itinerary Planner</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div id="hero"></div>
  <div id="content"></div>
</div>

<script type="module">
import { api, money, el, toCents } from '/app.js';
import { hero, formatDay, formatRange, nightsLabel, settlementLines } from '/trip-ui.js';

// /t/<token>, so take the segment after "t" rather than the last one — the
// report page lives at /t/<token>/report and would otherwise parse as "report".
const token = window.location.pathname.split('/').filter(Boolean)[1];
const content = document.getElementById('content');
let trip = null;

// Which row is open in its editor: { collection, id }, or null when nothing is
// being edited. render() draws that one row as a form instead of a summary
// line, so opening and closing an editor is a state change plus a re-render
// rather than hand-patching the DOM.
let editing = null;

function card(title, ...children) {
  return el('div', { class: 'card' }, el('h2', {}, title), ...children);
}

// One tap to record who paid for something. The alternative is opening the row's
// editor and saving it, which is far too slow for setting a payer on every stay.
function payerChips(collection, item) {
  if (!trip.canEdit || !trip.travellers.length) return null;

  const row = el('div', { class: 'chip-row' }, el('span', { class: 'chip-label' }, 'Paid by'));

  for (const traveller of trip.travellers) {
    const selected = item.paidBy === traveller.id;
    const chip = el('button', {
      type: 'button',
      class: 'chip',
      'aria-pressed': String(selected),
    }, traveller.name);

    chip.addEventListener('click', async () => {
      for (const button of row.querySelectorAll('button')) button.disabled = true;
      try {
        // Tapping the current payer clears it, so a mistake is one tap to undo.
        render(await api(`/api/trips/${token}/${collection}/${item.id}`, {
          method: 'PATCH',
          body: JSON.stringify({ paidBy: selected ? '' : traveller.id }),
        }));
      } catch (err) {
        alert(err.message);
        for (const button of row.querySelectorAll('button')) button.disabled = false;
      }
    });

    row.append(chip);
  }

  return row;
}

// Assigns every cost that has no payer yet in one go, for the common case where
// one person fronted the whole trip.
function bulkPayerRow() {
  const unassigned = [...trip.stays, ...trip.activities, ...(trip.expenses || [])]
    .filter((item) => !item.paidBy && toCents(item.cost) > 0);

  if (!trip.canEdit || !trip.travellers.length || !unassigned.length) return null;

  const row = el('div', { class: 'chip-row' },
    el('span', { class: 'chip-label' },
      `${unassigned.length} cost${unassigned.length === 1 ? '' : 's'} with no payer — set all to`));

  for (const traveller of trip.travellers) {
    const chip = el('button', { type: 'button', class: 'chip' }, traveller.name);

    chip.addEventListener('click', async () => {
      for (const button of row.querySelectorAll('button')) button.disabled = true;
      try {
        let latest = null;
        for (const item of unassigned) {
          const collection = trip.stays.includes(item)
            ? 'stays'
            : trip.activities.includes(item)
              ? 'activities'
              : 'expenses';
          latest = await api(`/api/trips/${token}/${collection}/${item.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ paidBy: traveller.id }),
          });
        }
        if (latest) render(latest);
      } catch (err) {
        alert(err.message);
        for (const button of row.querySelectorAll('button')) button.disabled = false;
      }
    });

    row.append(chip);
  }

  return el('div', { style: 'margin-bottom:16px' }, row);
}

const EXPENSE_CATEGORIES = ['Food & drink', 'Transport', 'Tickets', 'Shopping', 'Fees', 'Other'];

// The same field list drives the add form and the edit form for a collection,
// so anything that can be created can also be changed afterwards.
function fieldsFor(collection, cur) {
  if (collection === 'expenses') {
    return [
      { key: 'name', label: 'What was it', placeholder: 'Dinner at Circular Quay' },
      { key: 'category', label: 'Category', list: EXPENSE_CATEGORIES, placeholder: 'Food & drink' },
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'location', label: 'Where', placeholder: 'Sydney CBD' },
      { key: 'cost', label: `Amount (${cur})`, type: 'number', step: '0.01', placeholder: '64.50' },
    ];
  }
  if (collection === 'stays') {
    return [
      { key: 'name', label: 'Hotel / place', placeholder: 'Hotel Yak & Yeti' },
      { key: 'address', label: 'Address', placeholder: 'Durbar Marg, Kathmandu' },
      { key: 'checkIn', label: 'Check in', type: 'date' },
      { key: 'checkOut', label: 'Check out', type: 'date' },
      { key: 'cost', label: `Cost (${cur})`, type: 'number', step: '0.01', placeholder: '450.00' },
      { key: 'bookingRef', label: 'Booking ref', placeholder: 'ABC123' },
      { key: 'mapUrl', label: 'Map link', placeholder: 'https://maps.google.com/…' },
    ];
  }
  if (collection === 'activities') {
    return [
      { key: 'name', label: 'Activity', placeholder: 'Everest scenic flight' },
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'time', label: 'Time', type: 'time' },
      { key: 'location', label: 'Location', placeholder: 'Tribhuvan Airport' },
      { key: 'cost', label: `Cost (${cur})`, type: 'number', step: '0.01', placeholder: '220.00' },
      { key: 'mapUrl', label: 'Map link', placeholder: 'https://maps.google.com/…' },
    ];
  }
  if (collection === 'packing') {
    return [{ key: 'name', label: 'Item', placeholder: 'Sunscreen' }];
  }
  if (collection === 'payments') {
    return [
      { key: 'name', label: 'What was it', placeholder: 'Bank transfer' },
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'cost', label: `Amount (${cur})`, type: 'number', step: '0.01', placeholder: '500.00' },
    ];
  }
  return [
    { key: 'name', label: 'Name', placeholder: 'Prabin' },
    { key: 'email', label: 'Email (optional)', type: 'email', placeholder: 'name@example.com' },
  ];
}

// Collections whose items carry a cost that can be split across a subset of the
// group, mirroring SPLITTABLE on the server.
const SPLITTABLE = new Set(['stays', 'activities', 'expenses']);

let formSeq = 0;

// A row of labelled inputs plus a submit button. With `item` it edits that item
// in place (PATCH); without one it adds a new item (POST).
function itemForm(collection, { item = null, onCancel = null } = {}) {
  const fields = fieldsFor(collection, trip.currency);
  const inputs = {};
  const grid = el('div', { class: 'grid' });
  const seq = (formSeq += 1);

  for (const field of fields) {
    const listId = field.list ? `list-${collection}-${field.key}-${seq}` : null;
    const input = el('input', {
      type: field.type || 'text',
      placeholder: field.placeholder || '',
      value: item ? (item[field.key] ?? '') : '',
      ...(field.step ? { step: field.step } : {}),
      // A datalist suggests the usual categories without forbidding a new one.
      ...(listId ? { list: listId } : {}),
    });
    inputs[field.key] = input;

    const cell = el('div', { class: 'field' }, el('label', {}, field.label), input);
    if (listId) {
      const datalist = el('datalist', { id: listId });
      for (const option of field.list) datalist.append(el('option', { value: option }));
      cell.append(datalist);
    }
    grid.append(cell);
  }

  // A repayment needs both ends. Recording it backwards would make the debt
  // worse rather than settling it, so the two selects sit together with a
  // sentence underneath spelling out what is about to be saved.
  let from = null;
  let to = null;
  if (collection === 'payments' && trip.travellers.length) {
    const options = (selected) => {
      const select = el('select', {});
      select.append(el('option', { value: '' }, 'Choose…'));
      for (const traveller of trip.travellers) {
        select.append(el('option', { value: traveller.id }, traveller.name));
      }
      select.value = selected || '';
      return select;
    };

    from = options(item && item.paidBy);
    to = options(item && item.paidTo);

    const preview = el('div', { class: 'row-meta' });
    const describe = () => {
      const payerName = from.selectedOptions[0]?.value ? from.selectedOptions[0].textContent : null;
      const payeeName = to.selectedOptions[0]?.value ? to.selectedOptions[0].textContent : null;
      const amount = toCents(inputs.cost ? inputs.cost.value : '');
      preview.textContent = payerName && payeeName && amount > 0
        ? `${payerName} pays ${payeeName} ${money(amount, trip.currency)}.`
        : 'Pick who paid, who they paid, and how much.';
    };

    from.addEventListener('change', describe);
    to.addEventListener('change', describe);
    if (inputs.cost) inputs.cost.addEventListener('input', describe);
    describe();

    grid.append(
      el('div', { class: 'field field-wide' },
        el('label', {}, 'Who paid whom'),
        el('div', { class: 'chip-row' },
          from, el('span', { class: 'chip-label' }, 'paid'), to),
        preview
      )
    );
  }

  // "Paid by" is a select over current travellers, so costs attach to a person.
  // Payments carry their own pair above, so they skip this.
  let payer = null;
  if (collection !== 'payments' && fields.some((f) => f.key === 'cost') && trip.travellers.length) {
    payer = el('select', {});
    payer.append(el('option', { value: '' }, 'Paid by — unassigned'));
    for (const traveller of trip.travellers) {
      payer.append(el('option', { value: traveller.id }, traveller.name));
    }
    // Set after the options exist, otherwise the value has nothing to match.
    payer.value = (item && item.paidBy) || '';
    grid.append(el('div', { class: 'field' }, el('label', {}, 'Paid by'), payer));
  }

  // Who the cost is split between. Not everyone shares every cost — one room for
  // Bharat and another for Ashish and Prabin should not be split three ways
  // each. An item with nobody named belongs to everyone, so an untouched form
  // starts with all boxes ticked.
  let sharers = null;
  if (SPLITTABLE.has(collection) && trip.travellers.length) {
    const boxes = el('div', { class: 'sharers' });
    sharers = [];
    const named = item && item.sharedBy && item.sharedBy.length ? item.sharedBy : null;
    for (const traveller of trip.travellers) {
      const box = el('input', { type: 'checkbox' });
      box.checked = named ? named.includes(traveller.id) : true;
      sharers.push({ id: traveller.id, box });
      boxes.append(el('label', { class: 'sharer' }, box, el('span', {}, traveller.name)));
    }
    grid.append(
      el('div', { class: 'field field-wide' },
        el('label', {}, 'Split between'),
        boxes,
        el('div', { class: 'row-meta' }, 'Untick anyone this cost is not for.')
      )
    );
  }

  const errorBox = el('div', { class: 'error' });
  const submit = el('button', { type: 'submit' }, item ? 'Save' : 'Add');
  const buttons = el('div', { class: 'form-actions' }, submit);

  if (onCancel) {
    const cancel = el('button', { class: 'ghost', type: 'button' }, 'Cancel');
    cancel.addEventListener('click', onCancel);
    buttons.append(cancel);
  }

  const form = el('form', {}, grid, buttons, errorBox);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.textContent = '';
    const body = {};
    for (const [key, input] of Object.entries(inputs)) body[key] = input.value;
    // Always sent, so an existing payer can be reassigned or cleared.
    if (payer) body.paidBy = payer.value;
    if (from) body.paidBy = from.value;
    if (to) body.paidTo = to.value;

    if (sharers) {
      const picked = sharers.filter((s) => s.box.checked).map((s) => s.id);
      // Everyone ticked is stored as "nobody named", which keeps the cost
      // shared by the whole group including anyone added to the trip later.
      body.sharedBy = picked.length === sharers.length ? [] : picked;
    }

    const path = item
      ? `/api/trips/${token}/${collection}/${item.id}`
      : `/api/trips/${token}/${collection}`;

    submit.disabled = true;
    try {
      const updated = await api(path, {
        method: item ? 'PATCH' : 'POST',
        body: JSON.stringify(body),
      });
      editing = null;
      render(updated);
    } catch (err) {
      errorBox.textContent = err.message;
      submit.disabled = false;
    }
  });

  return form;
}

function isEditing(collection, itemId) {
  return editing !== null && editing.collection === collection && editing.id === itemId;
}

function editRow(collection, item) {
  return el('div', { class: 'row row-editing' },
    itemForm(collection, {
      item,
      onCancel: () => { editing = null; render(trip); },
    })
  );
}

function editButton(collection, itemId) {
  const button = el('button', { class: 'link edit', type: 'button' }, 'Edit');
  button.addEventListener('click', () => {
    editing = { collection, id: itemId };
    render(trip);
  });
  return button;
}

function removeButton(collection, itemId) {
  const button = el('button', { class: 'link', type: 'button' }, 'Remove');
  button.addEventListener('click', async () => {
    try {
      const updated = await api(`/api/trips/${token}/${collection}/${itemId}`, { method: 'DELETE' });
      if (isEditing(collection, itemId)) editing = null;
      render(updated);
    } catch (err) {
      alert(err.message);
    }
  });
  return button;
}

function rowActions(collection, itemId) {
  if (!trip.canEdit) return null;
  return el('div', { class: 'row-actions' },
    editButton(collection, itemId),
    removeButton(collection, itemId)
  );
}

function mapLink(url) {
  if (!url) return null;
  return el('a', { class: 'maplink', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Open map ↗');
}

function payerName(id) {
  const match = trip.travellers.find((t) => t.id === id);
  return match ? match.name : null;
}

// Only worth showing when a cost is *not* shared by everyone; saying "shared by
// Bharat, Ashish, Prabin" on every line when that is the default is just noise.
function sharedLabel(item) {
  const named = (item.sharedBy || []).filter((id) => payerName(id));
  if (!named.length || named.length === trip.travellers.length) return null;
  return `Split between ${named.map(payerName).join(', ')}`;
}

// --- Place suggestions ------------------------------------------------------
// Backed by OpenStreetMap, which is free but donated infrastructure, so this is
// never fetched automatically on page load — someone has to ask for it. The
// server caches results for a day, so asking again is free and instant.
let suggestions = null;
let suggestionsBusy = false;

async function loadSuggestions(customQuery = '') {
  suggestionsBusy = true;
  render(trip);
  try {
    const qs = customQuery ? `?q=${encodeURIComponent(customQuery)}` : '';
    suggestions = await api(`/api/trips/${token}/suggestions${qs}`);
  } catch (err) {
    suggestions = { configured: true, places: [], error: err.message };
  } finally {
    suggestionsBusy = false;
    render(trip);
  }
}

function suggestionRow(place) {
  const facts = [
    place.kind,
    place.rating ? `${place.rating}★${place.ratingCount ? ` (${place.ratingCount.toLocaleString()})` : ''}` : null,
  ].filter(Boolean).join(' · ');

  const side = el('div', { class: 'row-side' });
  if (trip.canEdit) {
    const add = el('button', { class: 'ghost', type: 'button' }, 'Add to itinerary');
    add.addEventListener('click', async () => {
      add.disabled = true;
      add.textContent = 'Adding…';
      try {
        const updated = await api(`/api/trips/${token}/activities`, {
          method: 'POST',
          body: JSON.stringify({
            name: place.name,
            location: place.address,
            mapUrl: place.mapUrl,
          }),
        });
        render(updated);
      } catch (err) {
        alert(err.message);
        add.disabled = false;
        add.textContent = 'Add to itinerary';
      }
    });
    side.append(add);
  }

  return el('div', { class: 'row' },
    el('div', { class: 'row-main' },
      el('div', { class: 'row-title' }, place.name),
      facts ? el('div', { class: 'row-meta' }, facts) : null,
      place.summary ? el('div', { class: 'row-meta' }, place.summary) : null,
      place.address ? el('div', { class: 'row-meta' }, place.address) : null,
      mapLink(place.mapUrl)
    ),
    side
  );
}

function suggestionsCard() {
  const children = [];
  const search = el('input', {
    placeholder: trip.destination ? `Search near ${trip.destination}` : 'e.g. Bondi Beach',
  });

  const go = el('button', { type: 'submit' }, suggestionsBusy ? 'Searching…' : 'Find places');
  if (suggestionsBusy) go.disabled = true;

  const form = el('form', {}, el('div', { class: 'share' }, search, go));
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!suggestionsBusy) loadSuggestions(search.value.trim());
  });
  children.push(form);

  if (!suggestions && !suggestionsBusy) {
    children.push(el('p', { class: 'empty' },
      trip.destination
        ? `Find attractions near ${trip.destination}, or search a different place above.`
        : 'Set a destination on the trip, or search a place above.'));
  } else if (suggestionsBusy) {
    children.push(el('p', { class: 'empty' }, 'Looking up places… this can take a few seconds.'));
  } else if (suggestions.error) {
    children.push(el('div', { class: 'error' }, suggestions.error));
  } else if (!suggestions.places.length) {
    children.push(el('p', { class: 'empty' }, 'Nothing came back for that search.'));
  } else {
    const list = el('div');
    for (const place of suggestions.places) list.append(suggestionRow(place));
    children.push(list);
    children.push(el('div', { class: 'row-meta', style: 'margin-top:10px' },
      `Attractions near ${suggestions.near || suggestions.query} · map data from OpenStreetMap contributors`));
  }

  return card('Places to go', ...children);
}

// Trip-level details: name, destination, dates, currency, notes.
function tripForm() {
  const inputs = {
    name: el('input', { value: trip.name, required: 'required', placeholder: 'Nepal, October' }),
    destination: el('input', { value: trip.destination, placeholder: 'Kathmandu & Pokhara' }),
    startDate: el('input', { type: 'date', value: trip.startDate }),
    endDate: el('input', { type: 'date', value: trip.endDate }),
    currency: el('input', { value: trip.currency, maxlength: '3', placeholder: 'USD' }),
  };

  const labels = {
    name: 'Trip name',
    destination: 'Destination',
    startDate: 'Start date',
    endDate: 'End date',
    currency: 'Currency',
  };

  const grid = el('div', { class: 'grid' });
  for (const [key, input] of Object.entries(inputs)) {
    grid.append(el('div', { class: 'field' }, el('label', {}, labels[key]), input));
  }

  const notes = el('textarea', { placeholder: 'Flight numbers, packing list, anything else…' }, trip.notes);
  const errorBox = el('div', { class: 'error' });
  const submit = el('button', { id: 'save-details', type: 'submit' }, 'Save details');

  const form = el('form', {},
    grid,
    el('div', { style: 'margin-top:12px' }, el('label', {}, 'Notes'), notes),
    el('div', { class: 'form-actions' }, submit),
    errorBox
  );

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.textContent = '';
    const body = { notes: notes.value };
    for (const [key, input] of Object.entries(inputs)) body[key] = input.value;

    submit.disabled = true;
    try {
      const updated = await api(`/api/trips/${token}`, {
        method: 'PATCH',
        body: JSON.stringify(body),
      });
      // render() replaces this form with a fresh one, so the confirmation has to
      // land on the new button rather than the node this handler closed over.
      render(updated);
      const saved = document.getElementById('save-details');
      if (saved) {
        saved.textContent = 'Saved';
        setTimeout(() => { saved.textContent = 'Save details'; }, 1500);
      }
    } catch (err) {
      errorBox.textContent = err.message;
      submit.disabled = false;
    }
  });

  return form;
}

function render(data) {
  trip = data;
  document.title = `${trip.name} · Itinerary Planner`;

  const sections = [];
  const cur = trip.currency;
  const s = trip.summary;

  // --- Hero ----------------------------------------------------------------
  const tripNights = trip.startDate && trip.endDate
    ? Math.max(0, Math.round(
        (Date.parse(`${trip.endDate}T00:00:00Z`) - Date.parse(`${trip.startDate}T00:00:00Z`)) / 86400000))
    : 0;
  const bookedNights = trip.stays.reduce((sum, stay) => sum + (stay.nights || 0), 0);
  const unbooked = (s.gaps || []).reduce((sum, g) => sum + g.nights, 0);

  document.getElementById('hero').replaceChildren(
    hero(trip, {
      tiles: [
        { label: 'Total', value: money(s.totalCents, cur) },
        s.headcount > 0 && s.splitEvenly
          ? { label: `Each (${s.headcount})`, value: money(s.perPersonCents, cur) }
          : null,
        tripNights
          ? {
              label: 'Nights booked',
              value: `${bookedNights} of ${tripNights}`,
              warn: unbooked > 0,
            }
          : null,
      ].filter(Boolean),
    })
  );

  // --- Trip details --------------------------------------------------------
  if (trip.canEdit) {
    sections.push(card('Trip details', tripForm()));
  } else if (trip.notes) {
    sections.push(card('Notes', el('div', { class: 'row-meta' }, trip.notes)));
  }

  // --- Costs ---------------------------------------------------------------
  const tile = (label, value) =>
    el('div', { class: 'total-tile' }, el('div', { class: 'k' }, label), el('div', { class: 'v' }, value));

  const tiles = el('div', { class: 'totals' },
    tile('Total', money(s.totalCents, cur)),
    tile('Stays', money(s.stayCents, cur)),
    tile('Activities', money(s.activityCents, cur)),
    tile('Expenses', money(s.expenseCents, cur)),
    // A single "each" figure only means anything while every cost is shared by
    // the whole group. Once one stay belongs to a subset, the real per-person
    // numbers are the shares in the balances list below.
    s.headcount > 0 && s.splitEvenly ? tile(`Each (${s.headcount})`, money(s.perPersonCents, cur)) : null
  );

  const costChildren = [tiles];

  if (s.headcount > 0 && !s.splitEvenly) {
    costChildren.push(el('div', { class: 'row-meta', style: 'margin-top:10px' },
      'Some costs are split between a subset of the group, so each person owes a different amount — see the shares below.'));
  }

  const categories = Object.entries(s.byCategory || {}).sort((a, b) => b[1] - a[1]);
  if (categories.length) {
    const breakdown = el('div', { class: 'cats' });
    for (const [label, cents] of categories) {
      breakdown.append(el('div', { class: 'cat' },
        el('span', { class: 'row-meta' }, label),
        el('span', { class: 'amount' }, money(cents, cur))
      ));
    }
    costChildren.push(el('div', { style: 'margin-top:16px' },
      el('label', {}, 'Expenses by category'), breakdown));
  }
  if (s.balances.length) {
    const balances = el('div', { style: 'margin-top:16px' });
    for (const b of s.balances) {
      const settled = b.netCents === 0;
      const label = settled
        ? 'settled up'
        : b.netCents > 0
          ? `is owed ${money(b.netCents, cur)}`
          : `owes ${money(-b.netCents, cur)}`;
      balances.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, b.name),
            el('div', { class: 'row-meta' }, `paid ${money(b.paidCents, cur)} · share ${money(b.oweCents, cur)}`)
          ),
          el('div', { class: 'row-side' },
            el('span', { class: settled ? 'row-meta' : b.netCents > 0 ? 'net-pos' : 'net-neg' }, label)
          )
        )
      );
    }
    costChildren.push(balances);

    // Net balances say how far off square each person is; this says what to
    // actually do about it.
    costChildren.push(el('div', { style: 'margin-top:18px' },
      el('label', {}, 'Settling up'),
      settlementLines(s.settlement, cur)
    ));

    const reports = el('div', { class: 'chip-row', style: 'margin-top:14px' },
      el('span', { class: 'chip-label' }, 'Reports'),
      el('a', { class: 'chip', href: `/t/${token}/report` }, 'Everyone')
    );
    for (const b of s.balances) {
      reports.append(
        el('a', { class: 'chip', href: `/t/${token}/report?p=${encodeURIComponent(b.id)}` }, b.name)
      );
    }
    costChildren.push(reports);
  }
  sections.push(card('Costs', ...costChildren));

  // --- Route ---------------------------------------------------------------
  // Stays are drawn as a journey rather than a list: for a trip that moves from
  // town to town, the order and the joins between stops are the point.
  const journey = el('ol', { class: 'journey' });
  const stays = [...trip.stays].sort((a, b) => (a.checkIn || '').localeCompare(b.checkIn || ''));

  // Per-night rates make an expensive-looking total comparable across stops.
  const rates = stays
    .filter((s) => s.nights > 0)
    .map((s) => Math.round(toCents(s.cost) / s.nights));
  const bestRate = rates.length > 1 ? Math.min(...rates) : null;

  const gapsByStart = new Map((s.gaps || []).map((g) => [g.from, g]));

  if (!stays.length) {
    journey.append(el('li', { class: 'empty' }, 'No stays added yet.'));
  } else {
    stays.forEach((stay, index) => {
      if (isEditing('stays', stay.id)) {
        journey.append(el('li', {}, editRow('stays', stay)));
        return;
      }

      const cents = toCents(stay.cost);
      const rate = stay.nights > 0 ? Math.round(cents / stay.nights) : null;
      const next = stays[index + 1];
      // A dashed connector marks a break in the dates; solid means the next stop
      // starts the day this one ends.
      const contiguous = next && stay.checkOut && stay.checkOut === next.checkIn;

      const when = [
        formatRange(stay.checkIn, stay.checkOut),
        stay.nights ? nightsLabel(stay.nights) : null,
      ].filter(Boolean).join(' · ');

      const meta = [stay.address, stay.bookingRef ? `Ref ${stay.bookingRef}` : null]
        .filter(Boolean).join(' · ');

      journey.append(
        el('li', { class: next && !contiguous ? 'leg leg-break' : 'leg' },
          el('div', { class: 'leg-body' },
            when ? el('div', { class: 'leg-when' }, when) : null,
            el('div', { class: 'leg-title' }, stay.name),
            meta ? el('div', { class: 'leg-meta' }, meta) : null,
            el('div', { class: 'leg-money' },
              el('span', { class: 'amount' }, money(cents, cur)),
              rate !== null && stay.nights > 1
                ? el('span', { class: 'rate' }, `${money(rate, cur)} / night`)
                : null,
              rate !== null && bestRate !== null && rate === bestRate
                ? el('span', { class: 'rate-best' }, 'best rate')
                : null
            ),
            payerName(stay.paidBy)
              ? el('div', { class: 'leg-meta' }, `Paid by ${payerName(stay.paidBy)}`)
              : null,
            sharedLabel(stay) ? el('div', { class: 'leg-meta shared' }, sharedLabel(stay)) : null,
            stay.notes ? el('div', { class: 'leg-meta' }, stay.notes) : null,
            mapLink(stay.mapUrl),
            payerChips('stays', stay),
            rowActions('stays', stay.id)
          )
        )
      );

      // Unbooked nights sit in the timeline where they actually fall, so a hole
      // in the plan is visible instead of being simply absent.
      const gap = stay.checkOut ? gapsByStart.get(stay.checkOut) : null;
      if (gap) {
        journey.append(
          el('li', { class: 'leg leg-gap' },
            el('div', { class: 'leg-body', role: 'status' },
              el('div', { class: 'leg-when' }, formatRange(gap.from, gap.to)),
              el('div', { class: 'leg-title' },
                `${nightsLabel(gap.nights)} with nowhere booked`),
              el('div', { class: 'leg-meta' }, 'Add a stay to cover this stretch.')
            )
          )
        );
      }
    });
  }

  // A gap before the first stay has no stop to hang off, so it goes on top.
  const leadingGap = (s.gaps || []).find((g) => g.from === trip.startDate)
    && (!stays.length || stays[0].checkIn !== trip.startDate)
    ? (s.gaps || []).find((g) => g.from === trip.startDate)
    : null;

  if (leadingGap) {
    journey.prepend(
      el('li', { class: 'leg leg-gap' },
        el('div', { class: 'leg-body', role: 'status' },
          el('div', { class: 'leg-when' }, formatRange(leadingGap.from, leadingGap.to)),
          el('div', { class: 'leg-title' },
            `${nightsLabel(leadingGap.nights)} with nowhere booked`),
          el('div', { class: 'leg-meta' }, 'Add a stay to cover this stretch.')
        )
      )
    );
  }

  const routeChildren = [bulkPayerRow(), journey].filter(Boolean);
  if (trip.canEdit) {
    routeChildren.push(el('div', { style: 'margin-top:18px' }, itemForm('stays')));
  }
  sections.push(card('Route', ...routeChildren));

  // --- Day by day ----------------------------------------------------------
  // The same trip read along the calendar instead of along the route. Read-only
  // on purpose: editing lives in Route, Things to do and Expenses, so there is
  // only ever one place where an item can be changed.
  const days = s.days || [];
  if (days.length) {
    const dayList = el('ol', { class: 'journey' });

    for (const day of days) {
      const heading = `Day ${day.index} · ${formatDay(day.date, { weekday: true })}`;
      const arriving = day.arriving.map((x) => x.name).join(', ');
      const departing = day.departing.map((x) => x.name).join(', ');

      const moves = [];
      if (departing) moves.push(`Leaving ${departing}`);
      if (arriving && day.stay) moves.push(`Arriving ${arriving}`);

      const nothingHappening = !day.stay && !day.activities.length && !day.expenses.length;
      const classes = ['leg'];
      if (!day.stay) classes.push('leg-gap');
      else if (!day.activities.length && !day.expenses.length) classes.push('leg-quiet');

      const body = el('div', { class: 'leg-body' },
        el('div', { class: 'leg-when' }, heading),
        el('div', { class: 'leg-title' },
          day.stay ? day.stay.name : nothingHappening ? 'Nowhere booked' : 'No bed booked'),
        moves.length ? el('div', { class: 'leg-meta' }, moves.join(' · ')) : null
      );

      for (const act of day.activities) {
        const when = [act.time, act.location].filter(Boolean).join(' · ');
        body.append(
          el('div', { class: 'row' },
            el('div', { class: 'row-main' },
              el('div', { class: 'row-title' }, act.name),
              when ? el('div', { class: 'row-meta' }, when) : null),
            el('div', { class: 'row-side' },
              el('div', { class: 'amount' }, money(toCents(act.cost), cur)))
          )
        );
      }

      for (const exp of day.expenses) {
        body.append(
          el('div', { class: 'row' },
            el('div', { class: 'row-main' },
              el('div', { class: 'row-title' }, exp.name),
              exp.category ? el('div', { class: 'row-meta' }, exp.category) : null),
            el('div', { class: 'row-side' },
              el('div', { class: 'amount' }, money(toCents(exp.cost), cur)))
          )
        );
      }

      dayList.append(el('li', { class: classes.join(' ') }, body));
    }

    // With no activities or expenses this is one line per stay — the same thing
    // Route already says — so it stays folded away until there is more to it.
    const worthOpening = trip.activities.length + (trip.expenses || []).length > 0;
    const details = el('details', worthOpening ? { open: 'open' } : {},
      el('summary', {},
        `${days.length} days · ${trip.activities.length} planned, `
        + `${(trip.expenses || []).length} expenses logged`),
      el('div', { style: 'margin-top:16px' }, dayList)
    );

    sections.push(card('Day by day', details));
  }

  // --- Activities ----------------------------------------------------------
  const actList = el('div');
  if (!trip.activities.length) {
    // "Nothing planned yet" reads as wrong next to a fully booked route, so say
    // what this section is actually for.
    actList.append(el('p', { class: 'empty' }, trip.canEdit
      ? 'No tours, bookings or things to do added yet — your stays are under Route.'
      : 'No tours or bookings added for this trip.'));
  } else {
    const sorted = [...trip.activities].sort((a, b) =>
      `${a.date || '9999'}${a.time || ''}`.localeCompare(`${b.date || '9999'}${b.time || ''}`)
    );
    for (const act of sorted) {
      if (isEditing('activities', act.id)) {
        actList.append(editRow('activities', act));
        continue;
      }

      const meta = [[act.date, act.time].filter(Boolean).join(' '), act.location]
        .filter(Boolean).join(' · ');
      actList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, act.name),
            meta ? el('div', { class: 'row-meta' }, meta) : null,
            payerName(act.paidBy) ? el('div', { class: 'row-meta' }, `Paid by ${payerName(act.paidBy)}`) : null,
            sharedLabel(act) ? el('div', { class: 'row-meta shared' }, sharedLabel(act)) : null,
            act.notes ? el('div', { class: 'row-meta' }, act.notes) : null,
            mapLink(act.mapUrl),
            payerChips('activities', act)
          ),
          el('div', { class: 'row-side' },
            el('div', { class: 'amount' }, money(toCents(act.cost), cur)),
            rowActions('activities', act.id)
          )
        )
      );
    }
  }

  const actChildren = [actList];
  if (trip.canEdit) {
    actChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('activities')));
  }
  // Not "Itinerary": the route above is the itinerary, and using that word for
  // an empty activities list makes a fully planned trip look unplanned.
  sections.push(card('Things to do', ...actChildren));

  // --- Suggestions ---------------------------------------------------------
  sections.push(suggestionsCard());

  // --- Expenses ------------------------------------------------------------
  // Everything that is not a bed or a booked activity: meals, taxis, tickets,
  // the round of coffees someone covered.
  const expenses = trip.expenses || [];
  const expList = el('div');
  if (!expenses.length) {
    expList.append(el('p', { class: 'empty' }, 'No expenses logged yet.'));
  } else {
    const sorted = [...expenses].sort((a, b) => `${b.date || ''}`.localeCompare(`${a.date || ''}`));
    for (const exp of sorted) {
      if (isEditing('expenses', exp.id)) {
        expList.append(editRow('expenses', exp));
        continue;
      }

      const meta = [exp.category, exp.date, exp.location].filter(Boolean).join(' · ');
      expList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, exp.name),
            meta ? el('div', { class: 'row-meta' }, meta) : null,
            payerName(exp.paidBy) ? el('div', { class: 'row-meta' }, `Paid by ${payerName(exp.paidBy)}`) : null,
            sharedLabel(exp) ? el('div', { class: 'row-meta shared' }, sharedLabel(exp)) : null,
            exp.notes ? el('div', { class: 'row-meta' }, exp.notes) : null
          ),
          el('div', { class: 'row-side' },
            el('div', { class: 'amount' }, money(toCents(exp.cost), cur)),
            rowActions('expenses', exp.id)
          )
        )
      );
    }
  }

  const expChildren = [expList];
  if (trip.canEdit) {
    expChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('expenses')));
  }
  sections.push(card('Expenses', ...expChildren));

  // --- Travellers ----------------------------------------------------------
  const travList = el('div');
  if (!trip.travellers.length) {
    travList.append(el('p', { class: 'empty' }, 'Add travellers to split costs between them.'));
  } else {
    for (const traveller of trip.travellers) {
      if (isEditing('travellers', traveller.id)) {
        travList.append(editRow('travellers', traveller));
        continue;
      }

      travList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, traveller.name),
            traveller.email ? el('div', { class: 'row-meta' }, traveller.email) : null
          ),
          el('div', { class: 'row-side' }, rowActions('travellers', traveller.id))
        )
      );
    }
  }

  const travChildren = [travList];
  if (trip.canEdit) {
    travChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('travellers')));
  }
  sections.push(card('Travellers', ...travChildren));

  // --- Packing list --------------------------------------------------------
  const packing = trip.packing || [];
  const packList = el('div');

  if (!packing.length) {
    packList.append(el('p', { class: 'empty' },
      trip.canEdit ? 'Nothing on the list yet.' : 'No packing list for this trip.'));
  } else {
    for (const entry of packing) {
      if (isEditing('packing', entry.id)) {
        packList.append(editRow('packing', entry));
        continue;
      }

      const box = el('input', { type: 'checkbox' });
      box.checked = entry.done;
      // Ticking is a write, so a read-only link can see the list and the
      // progress but cannot change it.
      if (!trip.canEdit) box.disabled = true;

      box.addEventListener('change', async () => {
        box.disabled = true;
        try {
          render(await api(`/api/trips/${token}/packing/${entry.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ done: box.checked }),
          }));
        } catch (err) {
          alert(err.message);
          box.checked = entry.done;
          box.disabled = false;
        }
      });

      packList.append(
        el('div', { class: entry.done ? 'row packed' : 'row' },
          el('div', { class: 'row-main' },
            el('label', { class: 'sharer' }, box, el('span', { class: 'row-title' }, entry.name)),
            entry.notes ? el('div', { class: 'row-meta' }, entry.notes) : null
          ),
          el('div', { class: 'row-side' }, rowActions('packing', entry.id))
        )
      );
    }
  }

  const packChildren = [];
  if (packing.length) {
    const done = packing.filter((p) => p.done).length;
    packChildren.push(el('div', { style: 'margin-bottom:10px' },
      el('span', { class: 'chip-static' }, `${done} of ${packing.length} packed`)));
  }
  packChildren.push(packList);
  if (trip.canEdit) {
    packChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('packing')));
  }
  sections.push(card('Packing list', ...packChildren));

  // --- Payments ------------------------------------------------------------
  // Repayments between travellers. These settle what the Costs card works out;
  // they are not trip costs and never change the total.
  const payments = trip.payments || [];
  const payChildren = [];

  if (payments.length) {
    const payList = el('div');
    const nameOf = (id) => payerName(id) || 'someone';

    for (const payment of payments) {
      if (isEditing('payments', payment.id)) {
        payList.append(editRow('payments', payment));
        continue;
      }

      const meta = [payment.date ? formatDay(payment.date, { year: true }) : null, payment.notes]
        .filter(Boolean).join(' · ');

      payList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' },
              `${nameOf(payment.paidBy)} → ${nameOf(payment.paidTo)}`),
            el('div', { class: 'row-meta' }, [payment.name, meta].filter(Boolean).join(' · '))
          ),
          el('div', { class: 'row-side' },
            el('div', { class: 'amount' }, money(toCents(payment.cost), cur)),
            rowActions('payments', payment.id)
          )
        )
      );
    }
    payChildren.push(payList);
  }

  if (trip.canEdit) {
    if (!trip.travellers.length) {
      payChildren.push(el('p', { class: 'empty' }, 'Add travellers before recording a payment.'));
    } else if (s.settlement.unpaidCents > 0) {
      // With nothing attributed there is no debt to settle, so an empty payment
      // form here would just look broken. Point at the thing that fixes it.
      payChildren.push(
        el('div', { class: 'notice', role: 'status' },
          el('strong', {}, `${money(s.settlement.unpaidCents, cur)} still has no payer.`),
          el('p', {}, 'Set who paid for each cost under Route first — until then '
            + 'there is nothing to settle.'))
      );
    } else {
      // One tap per outstanding transfer fills the form the right way round.
      if (s.settlement.transfers.length) {
        const quick = el('div', { class: 'chip-row', style: 'margin-bottom:14px' },
          el('span', { class: 'chip-label' }, 'Record'));

        for (const transfer of s.settlement.transfers) {
          const chip = el('button', { type: 'button', class: 'chip' },
            `${transfer.fromName} → ${transfer.toName} ${money(transfer.cents, cur)}`);

          chip.addEventListener('click', async () => {
            chip.disabled = true;
            try {
              render(await api(`/api/trips/${token}/payments`, {
                method: 'POST',
                body: JSON.stringify({
                  name: 'Settling up',
                  cost: (transfer.cents / 100).toFixed(2),
                  paidBy: transfer.fromId,
                  paidTo: transfer.toId,
                  date: new Date().toISOString().slice(0, 10),
                }),
              }));
            } catch (err) {
              alert(err.message);
              chip.disabled = false;
            }
          });

          quick.append(chip);
        }
        payChildren.push(quick);
      }

      payChildren.push(itemForm('payments'));
    }
  } else if (!payments.length) {
    payChildren.push(el('p', { class: 'empty' }, 'Nothing has been paid back yet.'));
  }

  sections.push(card('Payments', ...payChildren));

  // --- Sharing -------------------------------------------------------------
  if (trip.canEdit) {
    const origin = window.location.origin;
    const shareRow = (label, url, hint) => {
      const input = el('input', { readonly: 'readonly', value: url });
      const copy = el('button', { class: 'ghost', type: 'button' }, 'Copy');
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(url);
        } catch {
          // Clipboard API needs HTTPS and permission; selecting the text is a
          // reliable fallback the user can finish with Cmd+C.
          input.select();
        }
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
      });
      return el('div', {},
        el('label', {}, label),
        el('div', { class: 'share' }, input, copy),
        el('div', { class: 'row-meta', style: 'margin-bottom:16px' }, hint)
      );
    };

    sections.push(card('Share this trip',
      shareRow('Read-only link — send this to the group',
        `${origin}/t/${trip.viewToken}`,
        'Anyone with this link can see the itinerary and costs but cannot change anything.'),
      shareRow('Edit link — keep this one to yourself',
        `${origin}/t/${trip.editToken}`,
        'Anyone with this link has full edit access, including deleting the trip.')
    ));
  } else {
    sections.push(card('Access', el('span', { class: 'pill' }, 'Read-only'),
      el('div', { class: 'row-meta', style: 'margin-top:8px' },
        'You are viewing a shared itinerary. Ask the trip owner for an edit link to make changes.')));
  }

  // Sections are built in whatever order is convenient above, then arranged
  // here. On a trip that moves around, the route is what you open the page for;
  // money is the follow-up, and the share links matter least once they are sent.
  const ORDER = ['Trip details', 'Notes', 'Route', 'Day by day', 'Costs', 'Payments',
    'Things to do', 'Expenses', 'Packing list', 'Places to go', 'Travellers',
    'Share this trip', 'Access'];

  const rank = (node) => {
    const heading = node.querySelector('h2');
    const index = heading ? ORDER.indexOf(heading.textContent) : -1;
    return index === -1 ? ORDER.length : index;
  };

  sections.sort((a, b) => rank(a) - rank(b));

  // The share card is the least important thing on the page once the links have
  // been sent, so it recedes rather than competing with the trip itself.
  const last = sections[sections.length - 1];
  const lastHeading = last && last.querySelector('h2');
  if (lastHeading && (lastHeading.textContent === 'Share this trip' || lastHeading.textContent === 'Access')) {
    last.classList.add('card-quiet');
  }

  content.replaceChildren(...sections);
}

api(`/api/trips/${token}`)
  .then(render)
  .catch((err) => {
    document.getElementById('hero').replaceChildren(
      el('h1', {}, 'Trip not found'),
      el('p', { class: 'row-meta' }, err.message)
    );
  });
</script>
</body>
</html>
