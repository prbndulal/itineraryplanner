<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip · Itinerary Planner</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1 id="trip-name">Loading…</h1>
    <p id="trip-sub"></p>
  </header>
  <div id="content"></div>
</div>

<script type="module">
import { api, money, el } from '/app.js';

const token = window.location.pathname.split('/').pop();
const content = document.getElementById('content');
let trip = null;

// Which row is open in its editor: { collection, id }, or null when nothing is
// being edited. render() draws that one row as a form instead of a summary
// line, so opening and closing an editor is a state change plus a re-render
// rather than hand-patching the DOM.
let editing = null;

function card(title, ...children) {
  return el('div', { class: 'card' }, el('h2', {}, title), ...children);
}

const EXPENSE_CATEGORIES = ['Food & drink', 'Transport', 'Tickets', 'Shopping', 'Fees', 'Other'];

// The same field list drives the add form and the edit form for a collection,
// so anything that can be created can also be changed afterwards.
function fieldsFor(collection, cur) {
  if (collection === 'expenses') {
    return [
      { key: 'name', label: 'What was it', placeholder: 'Dinner at Circular Quay' },
      { key: 'category', label: 'Category', list: EXPENSE_CATEGORIES, placeholder: 'Food & drink' },
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'location', label: 'Where', placeholder: 'Sydney CBD' },
      { key: 'cost', label: `Amount (${cur})`, type: 'number', step: '0.01', placeholder: '64.50' },
    ];
  }
  if (collection === 'stays') {
    return [
      { key: 'name', label: 'Hotel / place', placeholder: 'Hotel Yak & Yeti' },
      { key: 'address', label: 'Address', placeholder: 'Durbar Marg, Kathmandu' },
      { key: 'checkIn', label: 'Check in', type: 'date' },
      { key: 'checkOut', label: 'Check out', type: 'date' },
      { key: 'cost', label: `Cost (${cur})`, type: 'number', step: '0.01', placeholder: '450.00' },
      { key: 'bookingRef', label: 'Booking ref', placeholder: 'ABC123' },
      { key: 'mapUrl', label: 'Map link', placeholder: 'https://maps.google.com/…' },
    ];
  }
  if (collection === 'activities') {
    return [
      { key: 'name', label: 'Activity', placeholder: 'Everest scenic flight' },
      { key: 'date', label: 'Date', type: 'date' },
      { key: 'time', label: 'Time', type: 'time' },
      { key: 'location', label: 'Location', placeholder: 'Tribhuvan Airport' },
      { key: 'cost', label: `Cost (${cur})`, type: 'number', step: '0.01', placeholder: '220.00' },
      { key: 'mapUrl', label: 'Map link', placeholder: 'https://maps.google.com/…' },
    ];
  }
  return [
    { key: 'name', label: 'Name', placeholder: 'Prabin' },
    { key: 'email', label: 'Email (optional)', type: 'email', placeholder: 'name@example.com' },
  ];
}

// Collections whose items carry a cost that can be split across a subset of the
// group, mirroring SPLITTABLE on the server.
const SPLITTABLE = new Set(['stays', 'activities', 'expenses']);

let formSeq = 0;

// A row of labelled inputs plus a submit button. With `item` it edits that item
// in place (PATCH); without one it adds a new item (POST).
function itemForm(collection, { item = null, onCancel = null } = {}) {
  const fields = fieldsFor(collection, trip.currency);
  const inputs = {};
  const grid = el('div', { class: 'grid' });
  const seq = (formSeq += 1);

  for (const field of fields) {
    const listId = field.list ? `list-${collection}-${field.key}-${seq}` : null;
    const input = el('input', {
      type: field.type || 'text',
      placeholder: field.placeholder || '',
      value: item ? (item[field.key] ?? '') : '',
      ...(field.step ? { step: field.step } : {}),
      // A datalist suggests the usual categories without forbidding a new one.
      ...(listId ? { list: listId } : {}),
    });
    inputs[field.key] = input;

    const cell = el('div', { class: 'field' }, el('label', {}, field.label), input);
    if (listId) {
      const datalist = el('datalist', { id: listId });
      for (const option of field.list) datalist.append(el('option', { value: option }));
      cell.append(datalist);
    }
    grid.append(cell);
  }

  // "Paid by" is a select over current travellers, so costs attach to a person.
  let payer = null;
  if (fields.some((f) => f.key === 'cost') && trip.travellers.length) {
    payer = el('select', {});
    payer.append(el('option', { value: '' }, 'Paid by — unassigned'));
    for (const traveller of trip.travellers) {
      payer.append(el('option', { value: traveller.id }, traveller.name));
    }
    // Set after the options exist, otherwise the value has nothing to match.
    payer.value = (item && item.paidBy) || '';
    grid.append(el('div', { class: 'field' }, el('label', {}, 'Paid by'), payer));
  }

  // Who the cost is split between. Not everyone shares every cost — one room for
  // Bharat and another for Ashish and Prabin should not be split three ways
  // each. An item with nobody named belongs to everyone, so an untouched form
  // starts with all boxes ticked.
  let sharers = null;
  if (SPLITTABLE.has(collection) && trip.travellers.length) {
    const boxes = el('div', { class: 'sharers' });
    sharers = [];
    const named = item && item.sharedBy && item.sharedBy.length ? item.sharedBy : null;
    for (const traveller of trip.travellers) {
      const box = el('input', { type: 'checkbox' });
      box.checked = named ? named.includes(traveller.id) : true;
      sharers.push({ id: traveller.id, box });
      boxes.append(el('label', { class: 'sharer' }, box, el('span', {}, traveller.name)));
    }
    grid.append(
      el('div', { class: 'field field-wide' },
        el('label', {}, 'Split between'),
        boxes,
        el('div', { class: 'row-meta' }, 'Untick anyone this cost is not for.')
      )
    );
  }

  const errorBox = el('div', { class: 'error' });
  const submit = el('button', { type: 'submit' }, item ? 'Save' : 'Add');
  const buttons = el('div', { class: 'form-actions' }, submit);

  if (onCancel) {
    const cancel = el('button', { class: 'ghost', type: 'button' }, 'Cancel');
    cancel.addEventListener('click', onCancel);
    buttons.append(cancel);
  }

  const form = el('form', {}, grid, buttons, errorBox);

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.textContent = '';
    const body = {};
    for (const [key, input] of Object.entries(inputs)) body[key] = input.value;
    // Always sent, so an existing payer can be reassigned or cleared.
    if (payer) body.paidBy = payer.value;

    if (sharers) {
      const picked = sharers.filter((s) => s.box.checked).map((s) => s.id);
      // Everyone ticked is stored as "nobody named", which keeps the cost
      // shared by the whole group including anyone added to the trip later.
      body.sharedBy = picked.length === sharers.length ? [] : picked;
    }

    const path = item
      ? `/api/trips/${token}/${collection}/${item.id}`
      : `/api/trips/${token}/${collection}`;

    submit.disabled = true;
    try {
      const updated = await api(path, {
        method: item ? 'PATCH' : 'POST',
        body: JSON.stringify(body),
      });
      editing = null;
      render(updated);
    } catch (err) {
      errorBox.textContent = err.message;
      submit.disabled = false;
    }
  });

  return form;
}

function isEditing(collection, itemId) {
  return editing !== null && editing.collection === collection && editing.id === itemId;
}

function editRow(collection, item) {
  return el('div', { class: 'row row-editing' },
    itemForm(collection, {
      item,
      onCancel: () => { editing = null; render(trip); },
    })
  );
}

function editButton(collection, itemId) {
  const button = el('button', { class: 'link edit', type: 'button' }, 'Edit');
  button.addEventListener('click', () => {
    editing = { collection, id: itemId };
    render(trip);
  });
  return button;
}

function removeButton(collection, itemId) {
  const button = el('button', { class: 'link', type: 'button' }, 'Remove');
  button.addEventListener('click', async () => {
    try {
      const updated = await api(`/api/trips/${token}/${collection}/${itemId}`, { method: 'DELETE' });
      if (isEditing(collection, itemId)) editing = null;
      render(updated);
    } catch (err) {
      alert(err.message);
    }
  });
  return button;
}

function rowActions(collection, itemId) {
  if (!trip.canEdit) return null;
  return el('div', { class: 'row-actions' },
    editButton(collection, itemId),
    removeButton(collection, itemId)
  );
}

function mapLink(url) {
  if (!url) return null;
  return el('a', { class: 'maplink', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Open map ↗');
}

function payerName(id) {
  const match = trip.travellers.find((t) => t.id === id);
  return match ? match.name : null;
}

// Only worth showing when a cost is *not* shared by everyone; saying "shared by
// Bharat, Ashish, Prabin" on every line when that is the default is just noise.
function sharedLabel(item) {
  const named = (item.sharedBy || []).filter((id) => payerName(id));
  if (!named.length || named.length === trip.travellers.length) return null;
  return `Split between ${named.map(payerName).join(', ')}`;
}

// --- Place suggestions ------------------------------------------------------
// Backed by OpenStreetMap, which is free but donated infrastructure, so this is
// never fetched automatically on page load — someone has to ask for it. The
// server caches results for a day, so asking again is free and instant.
let suggestions = null;
let suggestionsBusy = false;

async function loadSuggestions(customQuery = '') {
  suggestionsBusy = true;
  render(trip);
  try {
    const qs = customQuery ? `?q=${encodeURIComponent(customQuery)}` : '';
    suggestions = await api(`/api/trips/${token}/suggestions${qs}`);
  } catch (err) {
    suggestions = { configured: true, places: [], error: err.message };
  } finally {
    suggestionsBusy = false;
    render(trip);
  }
}

function suggestionRow(place) {
  const facts = [
    place.kind,
    place.rating ? `${place.rating}★${place.ratingCount ? ` (${place.ratingCount.toLocaleString()})` : ''}` : null,
  ].filter(Boolean).join(' · ');

  const side = el('div', { class: 'row-side' });
  if (trip.canEdit) {
    const add = el('button', { class: 'ghost', type: 'button' }, 'Add to itinerary');
    add.addEventListener('click', async () => {
      add.disabled = true;
      add.textContent = 'Adding…';
      try {
        const updated = await api(`/api/trips/${token}/activities`, {
          method: 'POST',
          body: JSON.stringify({
            name: place.name,
            location: place.address,
            mapUrl: place.mapUrl,
          }),
        });
        render(updated);
      } catch (err) {
        alert(err.message);
        add.disabled = false;
        add.textContent = 'Add to itinerary';
      }
    });
    side.append(add);
  }

  return el('div', { class: 'row' },
    el('div', { class: 'row-main' },
      el('div', { class: 'row-title' }, place.name),
      facts ? el('div', { class: 'row-meta' }, facts) : null,
      place.summary ? el('div', { class: 'row-meta' }, place.summary) : null,
      place.address ? el('div', { class: 'row-meta' }, place.address) : null,
      mapLink(place.mapUrl)
    ),
    side
  );
}

function suggestionsCard() {
  const children = [];
  const search = el('input', {
    placeholder: trip.destination ? `Search near ${trip.destination}` : 'e.g. Bondi Beach',
  });

  const go = el('button', { type: 'submit' }, suggestionsBusy ? 'Searching…' : 'Find places');
  if (suggestionsBusy) go.disabled = true;

  const form = el('form', {}, el('div', { class: 'share' }, search, go));
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!suggestionsBusy) loadSuggestions(search.value.trim());
  });
  children.push(form);

  if (!suggestions && !suggestionsBusy) {
    children.push(el('p', { class: 'empty' },
      trip.destination
        ? `Find attractions near ${trip.destination}, or search a different place above.`
        : 'Set a destination on the trip, or search a place above.'));
  } else if (suggestionsBusy) {
    children.push(el('p', { class: 'empty' }, 'Looking up places… this can take a few seconds.'));
  } else if (suggestions.error) {
    children.push(el('div', { class: 'error' }, suggestions.error));
  } else if (!suggestions.places.length) {
    children.push(el('p', { class: 'empty' }, 'Nothing came back for that search.'));
  } else {
    const list = el('div');
    for (const place of suggestions.places) list.append(suggestionRow(place));
    children.push(list);
    children.push(el('div', { class: 'row-meta', style: 'margin-top:10px' },
      `Attractions near ${suggestions.near || suggestions.query} · map data from OpenStreetMap contributors`));
  }

  return card('Places to go', ...children);
}

// Trip-level details: name, destination, dates, currency, notes.
function tripForm() {
  const inputs = {
    name: el('input', { value: trip.name, required: 'required', placeholder: 'Nepal, October' }),
    destination: el('input', { value: trip.destination, placeholder: 'Kathmandu & Pokhara' }),
    startDate: el('input', { type: 'date', value: trip.startDate }),
    endDate: el('input', { type: 'date', value: trip.endDate }),
    currency: el('input', { value: trip.currency, maxlength: '3', placeholder: 'USD' }),
  };

  const labels = {
    name: 'Trip name',
    destination: 'Destination',
    startDate: 'Start date',
    endDate: 'End date',
    currency: 'Currency',
  };

  const grid = el('div', { class: 'grid' });
  for (const [key, input] of Object.entries(inputs)) {
    grid.append(el('div', { class: 'field' }, el('label', {}, labels[key]), input));
  }

  const notes = el('textarea', { placeholder: 'Flight numbers, packing list, anything else…' }, trip.notes);
  const errorBox = el('div', { class: 'error' });
  const submit = el('button', { id: 'save-details', type: 'submit' }, 'Save details');

  const form = el('form', {},
    grid,
    el('div', { style: 'margin-top:12px' }, el('label', {}, 'Notes'), notes),
    el('div', { class: 'form-actions' }, submit),
    errorBox
  );

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.textContent = '';
    const body = { notes: notes.value };
    for (const [key, input] of Object.entries(inputs)) body[key] = input.value;

    submit.disabled = true;
    try {
      const updated = await api(`/api/trips/${token}`, {
        method: 'PATCH',
        body: JSON.stringify(body),
      });
      // render() replaces this form with a fresh one, so the confirmation has to
      // land on the new button rather than the node this handler closed over.
      render(updated);
      const saved = document.getElementById('save-details');
      if (saved) {
        saved.textContent = 'Saved';
        setTimeout(() => { saved.textContent = 'Save details'; }, 1500);
      }
    } catch (err) {
      errorBox.textContent = err.message;
      submit.disabled = false;
    }
  });

  return form;
}

function render(data) {
  trip = data;
  document.getElementById('trip-name').textContent = trip.name;
  document.title = `${trip.name} · Itinerary Planner`;

  const dates = [trip.startDate, trip.endDate].filter(Boolean).join(' → ');
  document.getElementById('trip-sub').textContent =
    [trip.destination, dates].filter(Boolean).join(' · ') || 'No dates set yet';

  const sections = [];
  const cur = trip.currency;

  // --- Trip details --------------------------------------------------------
  if (trip.canEdit) {
    sections.push(card('Trip details', tripForm()));
  } else if (trip.notes) {
    sections.push(card('Notes', el('div', { class: 'row-meta' }, trip.notes)));
  }

  // --- Costs ---------------------------------------------------------------
  const s = trip.summary;
  const tile = (label, value) =>
    el('div', { class: 'total-tile' }, el('div', { class: 'k' }, label), el('div', { class: 'v' }, value));

  const tiles = el('div', { class: 'totals' },
    tile('Total', money(s.totalCents, cur)),
    tile('Stays', money(s.stayCents, cur)),
    tile('Activities', money(s.activityCents, cur)),
    tile('Expenses', money(s.expenseCents, cur)),
    // A single "each" figure only means anything while every cost is shared by
    // the whole group. Once one stay belongs to a subset, the real per-person
    // numbers are the shares in the balances list below.
    s.headcount > 0 && s.splitEvenly ? tile(`Each (${s.headcount})`, money(s.perPersonCents, cur)) : null
  );

  const costChildren = [tiles];

  if (s.headcount > 0 && !s.splitEvenly) {
    costChildren.push(el('div', { class: 'row-meta', style: 'margin-top:10px' },
      'Some costs are split between a subset of the group, so each person owes a different amount — see the shares below.'));
  }

  const categories = Object.entries(s.byCategory || {}).sort((a, b) => b[1] - a[1]);
  if (categories.length) {
    const breakdown = el('div', { class: 'cats' });
    for (const [label, cents] of categories) {
      breakdown.append(el('div', { class: 'cat' },
        el('span', { class: 'row-meta' }, label),
        el('span', { class: 'amount' }, money(cents, cur))
      ));
    }
    costChildren.push(el('div', { style: 'margin-top:16px' },
      el('label', {}, 'Expenses by category'), breakdown));
  }
  if (s.balances.length) {
    const balances = el('div', { style: 'margin-top:16px' });
    for (const b of s.balances) {
      const settled = b.netCents === 0;
      const label = settled
        ? 'settled up'
        : b.netCents > 0
          ? `is owed ${money(b.netCents, cur)}`
          : `owes ${money(-b.netCents, cur)}`;
      balances.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, b.name),
            el('div', { class: 'row-meta' }, `paid ${money(b.paidCents, cur)} · share ${money(b.oweCents, cur)}`)
          ),
          el('div', { class: 'row-side' },
            el('span', { class: settled ? 'row-meta' : b.netCents > 0 ? 'net-pos' : 'net-neg' }, label)
          )
        )
      );
    }
    costChildren.push(balances);
  }
  sections.push(card('Costs', ...costChildren));

  // --- Stays ---------------------------------------------------------------
  const stayList = el('div');
  if (!trip.stays.length) {
    stayList.append(el('p', { class: 'empty' }, 'No stays added yet.'));
  } else {
    for (const stay of trip.stays) {
      if (isEditing('stays', stay.id)) {
        stayList.append(editRow('stays', stay));
        continue;
      }

      const meta = [stay.address, [stay.checkIn, stay.checkOut].filter(Boolean).join(' → ')]
        .filter(Boolean).join(' · ');
      const extra = [
        stay.nights ? `${stay.nights} night${stay.nights === 1 ? '' : 's'}` : null,
        stay.bookingRef ? `Ref ${stay.bookingRef}` : null,
        payerName(stay.paidBy) ? `Paid by ${payerName(stay.paidBy)}` : null,
      ].filter(Boolean).join(' · ');

      stayList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, stay.name),
            meta ? el('div', { class: 'row-meta' }, meta) : null,
            extra ? el('div', { class: 'row-meta' }, extra) : null,
            sharedLabel(stay) ? el('div', { class: 'row-meta shared' }, sharedLabel(stay)) : null,
            stay.notes ? el('div', { class: 'row-meta' }, stay.notes) : null,
            mapLink(stay.mapUrl)
          ),
          el('div', { class: 'row-side' },
            el('div', { class: 'amount' }, money(Math.round(Number(stay.cost || 0) * 100), cur)),
            rowActions('stays', stay.id)
          )
        )
      );
    }
  }

  const stayChildren = [stayList];
  if (trip.canEdit) {
    stayChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('stays')));
  }
  sections.push(card('Where you are staying', ...stayChildren));

  // --- Activities ----------------------------------------------------------
  const actList = el('div');
  if (!trip.activities.length) {
    actList.append(el('p', { class: 'empty' }, 'Nothing planned yet.'));
  } else {
    const sorted = [...trip.activities].sort((a, b) =>
      `${a.date || '9999'}${a.time || ''}`.localeCompare(`${b.date || '9999'}${b.time || ''}`)
    );
    for (const act of sorted) {
      if (isEditing('activities', act.id)) {
        actList.append(editRow('activities', act));
        continue;
      }

      const meta = [[act.date, act.time].filter(Boolean).join(' '), act.location]
        .filter(Boolean).join(' · ');
      actList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, act.name),
            meta ? el('div', { class: 'row-meta' }, meta) : null,
            payerName(act.paidBy) ? el('div', { class: 'row-meta' }, `Paid by ${payerName(act.paidBy)}`) : null,
            sharedLabel(act) ? el('div', { class: 'row-meta shared' }, sharedLabel(act)) : null,
            act.notes ? el('div', { class: 'row-meta' }, act.notes) : null,
            mapLink(act.mapUrl)
          ),
          el('div', { class: 'row-side' },
            el('div', { class: 'amount' }, money(Math.round(Number(act.cost || 0) * 100), cur)),
            rowActions('activities', act.id)
          )
        )
      );
    }
  }

  const actChildren = [actList];
  if (trip.canEdit) {
    actChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('activities')));
  }
  sections.push(card('Itinerary', ...actChildren));

  // --- Suggestions ---------------------------------------------------------
  sections.push(suggestionsCard());

  // --- Expenses ------------------------------------------------------------
  // Everything that is not a bed or a booked activity: meals, taxis, tickets,
  // the round of coffees someone covered.
  const expenses = trip.expenses || [];
  const expList = el('div');
  if (!expenses.length) {
    expList.append(el('p', { class: 'empty' }, 'No expenses logged yet.'));
  } else {
    const sorted = [...expenses].sort((a, b) => `${b.date || ''}`.localeCompare(`${a.date || ''}`));
    for (const exp of sorted) {
      if (isEditing('expenses', exp.id)) {
        expList.append(editRow('expenses', exp));
        continue;
      }

      const meta = [exp.category, exp.date, exp.location].filter(Boolean).join(' · ');
      expList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, exp.name),
            meta ? el('div', { class: 'row-meta' }, meta) : null,
            payerName(exp.paidBy) ? el('div', { class: 'row-meta' }, `Paid by ${payerName(exp.paidBy)}`) : null,
            sharedLabel(exp) ? el('div', { class: 'row-meta shared' }, sharedLabel(exp)) : null,
            exp.notes ? el('div', { class: 'row-meta' }, exp.notes) : null
          ),
          el('div', { class: 'row-side' },
            el('div', { class: 'amount' }, money(Math.round(Number(exp.cost || 0) * 100), cur)),
            rowActions('expenses', exp.id)
          )
        )
      );
    }
  }

  const expChildren = [expList];
  if (trip.canEdit) {
    expChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('expenses')));
  }
  sections.push(card('Expenses', ...expChildren));

  // --- Travellers ----------------------------------------------------------
  const travList = el('div');
  if (!trip.travellers.length) {
    travList.append(el('p', { class: 'empty' }, 'Add travellers to split costs between them.'));
  } else {
    for (const traveller of trip.travellers) {
      if (isEditing('travellers', traveller.id)) {
        travList.append(editRow('travellers', traveller));
        continue;
      }

      travList.append(
        el('div', { class: 'row' },
          el('div', { class: 'row-main' },
            el('div', { class: 'row-title' }, traveller.name),
            traveller.email ? el('div', { class: 'row-meta' }, traveller.email) : null
          ),
          el('div', { class: 'row-side' }, rowActions('travellers', traveller.id))
        )
      );
    }
  }

  const travChildren = [travList];
  if (trip.canEdit) {
    travChildren.push(el('div', { style: 'margin-top:16px' }, itemForm('travellers')));
  }
  sections.push(card('Travellers', ...travChildren));

  // --- Sharing -------------------------------------------------------------
  if (trip.canEdit) {
    const origin = window.location.origin;
    const shareRow = (label, url, hint) => {
      const input = el('input', { readonly: 'readonly', value: url });
      const copy = el('button', { class: 'ghost', type: 'button' }, 'Copy');
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(url);
        } catch {
          // Clipboard API needs HTTPS and permission; selecting the text is a
          // reliable fallback the user can finish with Cmd+C.
          input.select();
        }
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
      });
      return el('div', {},
        el('label', {}, label),
        el('div', { class: 'share' }, input, copy),
        el('div', { class: 'row-meta', style: 'margin-bottom:16px' }, hint)
      );
    };

    sections.push(card('Share this trip',
      shareRow('Read-only link — send this to the group',
        `${origin}/t/${trip.viewToken}`,
        'Anyone with this link can see the itinerary and costs but cannot change anything.'),
      shareRow('Edit link — keep this one to yourself',
        `${origin}/t/${trip.editToken}`,
        'Anyone with this link has full edit access, including deleting the trip.')
    ));
  } else {
    sections.push(card('Access', el('span', { class: 'pill' }, 'Read-only'),
      el('div', { class: 'row-meta', style: 'margin-top:8px' },
        'You are viewing a shared itinerary. Ask the trip owner for an edit link to make changes.')));
  }

  content.replaceChildren(...sections);
}

api(`/api/trips/${token}`)
  .then(render)
  .catch((err) => {
    document.getElementById('trip-name').textContent = 'Trip not found';
    document.getElementById('trip-sub').textContent = err.message;
  });
</script>
</body>
</html>
